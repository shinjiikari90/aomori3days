    <script src="https://cdn.tailwindcss.com"></script>

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        .ios-blur {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        /* Leaflet custom marker styling */
        .custom-map-marker {
            background: #0284c7;
            color: white;
            border: 2px solid white;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);

<body class="bg-slate-50 min-h-screen pb-12">

    <header class="bg-gradient-to-r from-rose-500 via-sky-600 to-indigo-600 text-white sticky top-0 z-50 shadow-lg">

                    </div>
                </div>
                <div class="bg-white/20 px-2.5 py-1 rounded-full text-xs font-semibold backdrop-blur-md">

                </div>
            </div>

            <div id="clockBanner" class="bg-slate-900/40 ios-blur rounded-2xl p-3 border border-white/20 flex flex-col gap-1.5 shadow-inner">

                    <span id="currentTimeText" class="font-mono text-sm font-extrabold tracking-wider text-amber-300">00:00:00</span>
                </div>
                <div id="activeTaskBox" class="bg-white/10 rounded-xl p-2.5 flex items-center justify-between text-xs backdrop-blur-sm">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <span class="relative flex h-2.5 w-2.5 shrink-0">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                        </span>
                        <div class="truncate">
                            <p class="text-slate-300 text-[9px] uppercase font-bold tracking-wider">현재 일정</p>
                            <p id="activeTaskTitle" class="font-bold text-white text-xs truncate">일정 로딩 중...</p>
                        </div>
                    </div>
                    <span id="activeTaskTime" class="bg-amber-500 text-white px-2 py-0.5 rounded-lg font-mono font-bold text-[10px] shrink-0">--:--</span>
                </div>
            </div>
        </div>
    </header>

            <button onclick="switchDay(1)" id="tab1" class="flex-1 py-2 rounded-xl font-bold text-xs transition bg-sky-600 text-white shadow-sm">
                1일차 <span class="block font-normal text-[10px] opacity-90">10.16 (금)</span>
            </button>
            <button onclick="switchDay(2)" id="tab2" class="flex-1 py-2 rounded-xl font-bold text-xs transition text-slate-600 hover:bg-white/50">
                2일차 <span class="block font-normal text-[10px] opacity-70">10.17 (토)</span>
            </button>
            <button onclick="switchDay(3)" id="tab3" class="flex-1 py-2 rounded-xl font-bold text-xs transition text-slate-600 hover:bg-white/50">
                3일차 <span class="block font-normal text-[10px] opacity-70">10.18 (일)</span>
            </button>
        </div>

        <!-- Interactive Map Section -->
        <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80 mb-4">
            <div class="flex items-center justify-between mb-2 px-1">

                    { start: "08:50", end: "09:00", time: "08:50 - 09:00", title: "교사이 센터 -> 호텔 복귀", cost: "-", type: "transit", note: "도보 10분", tip: "짐을 챙기러 복귀." },
                    { start: "09:15", end: "09:20", time: "09:15 - 09:20", title: "체크아웃 완료", cost: "-", type: "hotel", note: "체크아웃 진행", tip: "소지품과 여권 재확인." },
                    { start: "09:20", end: "09:50", time: "09:20 - 09:50", title: "호텔 -> 아오모리역 버스정류장", cost: "-", type: "transit", note: "도보 이동", tip: "공항 리무진 탑승장 이동." },
                    { start: "10:00", end: "10:35", time: "10:00 - 10:35", title: "아오모리역 -> 아오모리공항 이동", cost: "￥860", type: "transit", note: "공항 버스 (860엔)", tip: "현금 잔돈 준비.", lat: 40.7332, lng: 140.6908 },
                    { start: "10:40", end: "11:30", time: "10:40 - 11:30", title: "체크인, 출국수속", cost: "-", type: "transit", note: "탑승 수속 및 보안검사", tip: "공항 매점을 둘러보세요." },
                    { start: "12:15", end: "12:35", time: "12:15 - 12:35", title: "KE2194 보딩", cost: "-", type: "flight", flightCode: "KE2194", note: "탑승 게이트 대기", tip: "남은 엔화 동전 사용!" },
                    { start: "12:45", end: "15:30", time: "12:45 - 15:30", title: "아오모리 -> 인천 귀국", cost: "-", type: "flight", flightCode: "KE2194", note: "대한항공 KE2194 귀국편", tip: "인천공항 도착 후 입국 수속." }
                ]
            }
        };

        let currentDay = 1;
        let leafletMap = null;
        let mapMarkers = [];
        let polylineLayer = null;

        // Initialize App
        window.onload = function() {
            initMap();
            switchDay(1);
            startRealClock();
        };

        // Initialize Leaflet OpenStreetMap
        function initMap() {
            // Aomori central coordinates
            leafletMap = L.map('map').setView([40.828, 140.738], 14);

            // OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(leafletMap);
        }

        // Switch Day Tabs
        function switchDay(dayNum) {
            currentDay = dayNum;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`tab${i}`);
                if (i === dayNum) {
                    btn.className = "flex-1 py-2 rounded-xl font-bold text-xs transition bg-sky-600 text-white shadow-sm";
                } else {
                    btn.className = "flex-1 py-2 rounded-xl font-bold text-xs transition text-slate-600 hover:bg-white/50";
                }
            }
            document.getElementById('mapDayTitle').innerText = `${dayNum}일차 아오모리 주요 동선 지도`;
            renderDay(dayNum);
            updateMapMarkers(dayNum);
        }

        function updateMapMarkers(dayNum) {
            if (!leafletMap) return;

            // Clear previous markers
            mapMarkers.forEach(m => leafletMap.removeLayer(m));
            mapMarkers = [];
            if (polylineLayer) {
                leafletMap.removeLayer(polylineLayer);
            }

            const items = travelData[dayNum].items;
            const routeCoords = [];
            let markCount = 1;

            items.forEach((item) => {
                if (item.lat && item.lng) {
                    const latLng = [item.lat, item.lng];
                    routeCoords.push(latLng);

                    // Create custom marker element
                    const customIcon = L.divIcon({
                        className: 'custom-map-marker',
                        html: `<span>${markCount}</span>`,
                        iconSize: [26, 26],
                        iconAnchor: [13, 13]
                    });

                    const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;

                    const marker = L.marker(latLng, { icon: customIcon }).addTo(leafletMap);
                    marker.bindPopup(`
                        <div class="text-xs p-1">
                            <strong class="text-sky-700 block text-sm font-bold mb-1">${markCount}. ${item.title}</strong>
                            <p class="text-slate-600 mb-2">${item.note || ''}</p>
                            <a href="${googleMapsUrl}" target="_blank" class="inline-block bg-sky-600 text-white font-bold px-2.5 py-1 rounded-lg text-[10px] hover:bg-sky-700 transition">
                                📍 구글 지도에서 열기
                            </a>
                        </div>
                    `);

                    mapMarkers.push(marker);
                    markCount++;
                }
            });

            // Draw polyline connecting markers
            if (routeCoords.length > 0) {
                polylineLayer = L.polyline(routeCoords, {
                    color: '#0284c7',
                    weight: 3.5,
                    dashArray: '6, 8',
                    opacity: 0.8
                }).addTo(leafletMap);

                // Fit map bounds to show all markers smoothly
                const bounds = L.latLngBounds(routeCoords);
                leafletMap.fitBounds(bounds, { padding: [40, 40] });
            }
        }

        function focusOnLocation(lat, lng, title) {
            if (!leafletMap || !lat || !lng) return;
            leafletMap.setView([lat, lng], 16, { animate: true, duration: 1 });
            
            // Find and open corresponding popup
            mapMarkers.forEach(m => {
                const pos = m.getLatLng();
                if (Math.abs(pos.lat - lat) < 0.0001 && Math.abs(pos.lng - lng) < 0.0001) {
                    m.openPopup();
                }
            });

            // Smooth scroll to top map container
            document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function renderDay(dayNum) {
            const data = travelData[dayNum];
            const container = document.getElementById('dayContent');
            
            let html = `
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/80 mb-3">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2.5">
                        <div>
                            <h2 class="font-extrabold text-slate-800 text-sm tracking-tight">${data.title}</h2>
                            <span class="text-[11px] text-sky-600 font-bold">${data.date}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-400 block font-medium">예상 1인 경비</span>
                            <span class="text-xs font-mono font-bold text-emerald-600">${data.totalCost}</span>
                        </div>
                    </div>
                    <div class="space-y-3">
            `;

            data.items.forEach((item) => {
                let badgeColor = "bg-slate-100 text-slate-600 border-slate-200";
                let icon = "📍";
                if (item.type === 'flight') { badgeColor = "bg-indigo-50 text-indigo-700 border-indigo-200"; icon = "✈️"; }
                else if (item.type === 'food') { badgeColor = "bg-amber-50 text-amber-700 border-amber-200"; icon = "🍜"; }
                else if (item.type === 'hotel') { badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200"; icon = "🏨"; }
                else if (item.type === 'transit') { badgeColor = "bg-purple-50 text-purple-700 border-purple-200"; icon = "🚌"; }
                else if (item.type === 'sight') { badgeColor = "bg-sky-50 text-sky-700 border-sky-200"; icon = "⛩️"; }
                else if (item.type === 'shop') { badgeColor = "bg-rose-50 text-rose-700 border-rose-200"; icon = "🛍️"; }

                let flightBtnHtml = '';
                if (item.flightCode) {
                    flightBtnHtml = `
                        <button onclick="openFlightModal('${item.flightCode}')" class="mt-2.5 text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl font-bold shadow-sm transition inline-flex items-center gap-1.5 active:scale-95">
                            ✈️ ${item.flightCode} 실시간 운항 상황 보기
                        </button>
                    `;
                }

                let mapFocusBtn = '';
                if (item.lat && item.lng) {
                    mapFocusBtn = `
                        <button onclick="focusOnLocation(${item.lat}, ${item.lng}, '${item.title}')" class="mt-2 text-[11px] bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 px-2.5 py-1 rounded-lg font-bold transition inline-flex items-center gap-1">
                            🗺️ 지도에서 위치 보기
                        </button>
                    `;
                }

                html += `
                    <div class="bg-slate-50 border border-slate-200/70 rounded-2xl p-3.5 hover:shadow-md transition">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center space-x-2.5">
                                <span class="text-xl">${icon}</span>
                                <div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-[11px] font-mono font-bold text-sky-700 bg-sky-100/70 px-2 py-0.5 rounded-md border border-sky-200/60">${item.time}</span>
                                        ${item.cost && item.cost !== '-' ? `<span class="text-[10px] font-mono font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded-md">${item.cost}</span>` : ''}
                                    </div>
                                    <h3 class="font-bold text-slate-800 text-sm mt-1 leading-snug">${item.title}</h3>
                                </div>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-full border font-bold ${badgeColor} shrink-0">${item.type.toUpperCase()}</span>
                        </div>
                        
                        ${item.note ? `<p class="text-xs text-slate-600 mt-2 font-medium bg-white p-2 rounded-xl border border-slate-100">📌 <strong>참고사항:</strong> ${item.note}</p>` : ''}

                        <div class="mt-2 bg-amber-50/80 border border-amber-200/60 p-2.5 rounded-xl text-[11px] text-amber-900 leading-relaxed">
                            <span class="font-bold text-amber-800 block mb-0.5">💡 상세 가이드 & 꿀팁</span>
                            ${item.tip}
                        </div>
                        <div class="flex gap-2">
                            ${mapFocusBtn}
                            ${flightBtnHtml}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Flight Modal Logic
        function openFlightModal(flightCode) {
            document.getElementById('modalFlightNumber').innerText = `${flightCode} 실시간 항공편 운항 상황`;
            if(flightCode === 'KE2193') {
                document.getElementById('modalDepLabel').innerText = "출발 (ICN T2)";
                document.getElementById('modalDepPlace').innerText = "인천공항";
                document.getElementById('modalDepTime').innerText = "09:05 출국";
                document.getElementById('modalArrLabel').innerText = "도착 (AOJ)";
                document.getElementById('modalArrPlace').innerText = "아오모리";
                document.getElementById('modalArrTime').innerText = "11:35 도착";
            } else {
                document.getElementById('modalDepLabel').innerText = "출발 (AOJ)";
                document.getElementById('modalDepPlace').innerText = "아오모리공항";
                document.getElementById('modalDepTime').innerText = "12:15 탑승 / 12:45 출국";
                document.getElementById('modalArrLabel').innerText = "도착 (ICN T2)";
                document.getElementById('modalArrPlace').innerText = "인천공항";
                document.getElementById('modalArrTime').innerText = "15:30 도착";
            }

            const modal = document.getElementById('flightModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('#flightModalContent').classList.remove('scale-95');
            }, 10);
        }

        function closeFlightModal() {
            const modal = document.getElementById('flightModal');
            modal.classList.add('opacity-0');
            modal.querySelector('#flightModalContent').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Realtime KST Clock & Schedule Matcher
        function startRealClock() {
            setInterval(() => {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const kstTime = new Date(utc + (3600000 * 9));
                
                const month = kstTime.getMonth() + 1;
                const day = kstTime.getDate();
                const hours = kstTime.getHours();
                const minutes = kstTime.getMinutes();
                const seconds = kstTime.getSeconds();
                
                const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                document.getElementById('currentDateText').innerText = `대한민국(KST) ${month}월 ${day}일`;
                document.getElementById('currentTimeText').innerText = timeStr;
                
                updateCurrentScheduleTask(hours, minutes);
            }, 1000);
        }

        function updateCurrentScheduleTask(hours, minutes) {
            const currentTotalMins = hours * 60 + minutes;
            let activeDayData = travelData[currentDay];
            let currentTask = null;

            for (let item of activeDayData.items) {
                if (!item.start || !item.end) continue;
                const [startH, startM] = item.start.split(':').map(Number);
                const [endH, endM] = item.end.split(':').map(Number);
                
                const startMins = startH * 60 + startM;
                const endMins = endH * 60 + endM;

                if (currentTotalMins >= startMins && currentTotalMins <= endMins) {
                    currentTask = item;
                    break;
                }
            }

            const titleEl = document.getElementById('activeTaskTitle');
            const timeEl = document.getElementById('activeTaskTime');

            if (currentTask) {
                titleEl.innerText = `${currentTask.title} (${currentTask.note || ''})`;
                timeEl.innerText = currentTask.time;
            } else {
                titleEl.innerText = `현재 예정된 자유 시간 또는 휴식 중입니다.`;
                timeEl.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }
        }
    </script>
</body>
</html>
